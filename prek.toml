[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-yaml" },
  { id = "check-added-large-files", args = ["--maxkb=6144"] },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "mixed-line-ending" },
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.29.0"
hooks = [{ id = "zizmor", args = ["--no-progress", "--persona=pedantic"] }]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
language = "system"
entry = "shellcheck"
files = '\.sh$'

[[repos.hooks]]
id = "stylua"
name = "stylua"
language = "system"
entry = "stylua --check"
files = '\.luau$'
